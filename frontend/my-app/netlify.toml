[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  framework = "#auto"
  command = "npm run dev"
  targetPort = 3456
  port = 8888
  publish = "dist"
  autoLaunch = false

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Proxy API requests to the existing backend
[[redirects]]
  from = "/api/*"
  to = "http://localhost:5001/api/:splat"
  status = 200
  force = true

# Handle SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
